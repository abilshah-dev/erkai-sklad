# /etc/nginx/sites-available/sklad.erkai.kg
# Каждый клиент — свой путь и свой порт. Сертификат: certbot --nginx -d sklad.erkai.kg
server {
    server_name sklad.erkai.kg;

    # Клиент 1 (порт из его .env). Слеш в конце proxy_pass обязателен — он убирает /client1 из пути.
    location /client1/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Следующий клиент — скопируйте блок и поменяйте имя и порт:
    # location /client2/ { proxy_pass http://127.0.0.1:8082/; proxy_set_header Host $host; }

    location = / { return 204; }

    listen 80;
}
